      state.roundIndex += 1;
      state.currentId = state.roundIds[state.roundIndex];
      startSpellingStep();
      els.answerInput.value = "";
      setResult(`进入下一条：${getRoundPosition()}。请听声音后写出单词或词组。`, "");
      renderPrompt();
      const item = getCurrentItem();
      if (item) speak(item.title);
    }

    function renderPrompt() {
      const item = getCurrentItem();
      if (!item) {
        els.promptBox.className = "prompt empty";
        els.promptBox.innerHTML = `
          <div>
            <div class="prompt-label">准备好了</div>
            <p>先添加几条英文材料，再开始随机听写练习。</p>
          </div>`;
        return;
      }
      const sentenceStep = state.reviewStep === "sentence";
      els.promptBox.className = "prompt";
      els.promptBox.innerHTML = `
        <div class="prompt-head">
          <div class="prompt-label">${sentenceStep ? "造句中" : "听写中"}</div>
          <button class="mini" data-play-current="single" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            单次播放
          </button>
          <button class="mini" data-play-current="repeat" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            重复播放
          </button>
        </div>
        <div>
          <strong>${sentenceStep ? `请用 “${escapeHtml(item.title)}” 造一个英文句子` : "请听声音后写出单词或词组"}</strong>
          <p class="hint">${escapeHtml(getRoundPosition() || "单条练习")} · 熟练答对 ${Number(item.correct || 0)} 次 · 复习 ${Number(item.reviews || 0)} 次 · ${sentenceStep ? "造句完成后，这条复习才会结束。" : "检查后进入造句环节。"}</p>
          ${sentenceStep ? "" : `
            <div class="mini-actions">
              <button class="mini" data-reveal-current="true" type="button">展示内容，进入造句</button>
              <button class="mini" data-reveal-skip-sentence="true" type="button">展示内容，下一条</button>
            </div>`}
        </div>`;
    }

    function getNextRoundText() {
      if (!state.roundIds.length) return "";
      const isLast = state.roundIndex >= state.roundIds.length - 1;
      return isLast ? "这是本轮最后一条。" : "点击“下一条”继续练习。";
    }

    function getNextRoundAction() {
      if (!state.roundIds.length) return "";
      const isLast = state.roundIndex >= state.roundIds.length - 1;
      if (isLast) return `<p>这是本轮最后一条。</p>`;
      return `
        <div class="mini-actions">
          <button class="mini" data-result-next="true" type="button">下一条</button>
        </div>
      `;
    }

    function recordReviewResult(item, remembered, score) {
      item.reviews = (item.reviews || 0) + 1;
      item.correct = (item.correct || 0) + (remembered ? 1 : 0);
      item.lastScore = score;
      item.lastReviewedAt = new Date().toISOString();
      scheduleNextReview(item, remembered);
      state.pendingJudgement = null;
      state.currentReview = null;
      state.reviewStep = "spelling";
      persist();
      renderAll();
    }

    async function getReviewDefinition(item) {
      return lookupDefinition(item.title);
    }

    function spellingMatches(expected, answer) {
      return normalized(expected) === normalized(answer) || expandContractions(expected) === expandContractions(answer);
    }

    function findDuplicateItem(title, ignoredId = null) {
      const target = normalized(title);
      return state.items.find(item => item.id !== ignoredId && normalized(item.title) === target) || null;
    }

    function startSpellingStep() {
      state.reviewStep = "spelling";
      state.pendingJudgement = null;
      state.currentReview = null;
      els.answerInput.placeholder = "听到后写出单词或词组...";
    }

    function startSentenceStep(spellingCorrect, spellingAnswer, revealed = false) {
      const item = getCurrentItem();
      if (!item) return;
      state.reviewStep = "sentence";
      state.pendingJudgement = null;
      state.currentReview = {
        itemId: item.id,
        spellingCorrect,
        spellingAnswer,
        revealed
      };
      els.answerInput.value = "";
      els.answerInput.placeholder = `用 ${item.title} 造一个英文句子...`;
      renderPrompt();
      setResult(`
        <strong>${spellingCorrect ? "拼写正确，进入造句环节。" : "已显示正确拼写，继续造句。"}</strong>
        <p><strong>正确拼写：</strong> ${escapeHtml(item.title)}</p>
        ${spellingAnswer ? `<p><strong>你的听写：</strong> ${escapeHtml(spellingAnswer)}</p>` : ""}
        <p>请用这个词或词组造一个英文句子，然后点击“检查”。</p>
      `, spellingCorrect ? "good" : "bad");
    }

    function completeSentenceStep(item, sentence, score) {
      const spellingCorrect = Boolean(state.currentReview?.spellingCorrect);
      const analysis = analyzeSentence(item.title, sentence);
      const sentenceGood = analysis.grammarOk && analysis.usesTerm;
      const spellingAnswer = state.currentReview?.spellingAnswer || "";
      state.pendingJudgement = {
        itemId: item.id,
        mode: "final",
        score: spellingCorrect && sentenceGood ? 100 : 40,
        spellingCorrect,
        sentenceGood,
        spellingAnswer,
        sentence,
        analysis
      };
      setResult(`
        <strong>造句已完成，请你判断这条是否需要复习。</strong>
        <p><strong>正确拼写：</strong> ${escapeHtml(item.title)}</p>
        ${spellingAnswer ? `<p><strong>你的听写：</strong> ${escapeHtml(spellingAnswer)}（${spellingCorrect ? "拼写正确" : "拼写有误"}）</p>` : ""}
        <p><strong>你的句子：</strong> ${escapeHtml(sentence)}</p>
        <p><strong>拼写判断：</strong> ${spellingCorrect ? "答对了" : "答错了 / 主动展示了答案"}</p>
        <p><strong>句子结构：</strong> ${escapeHtml(analysis.structure)}</p>
        <p><strong>语法判断：</strong> ${analysis.grammarOk ? "没有发现明显语法问题。" : analysis.issues.map(escapeHtml).join("；")}</p>
        <p><strong>地道程度：</strong> ${analysis.naturalOk ? "表达自然，暂时不需要修改。" : analysis.naturalTips.map(escapeHtml).join("；")}</p>
        ${analysis.improved ? `<p><strong>更地道表达：</strong> ${escapeHtml(analysis.improved)}</p>` : ""}
        <div class="mini-actions">
          <button class="mini" data-final-judge="remembered" type="button">记为掌握</button>
          <button class="mini" data-final-judge="review" type="button">需要复习</button>
        </div>
      `, sentenceGood ? "good" : "bad");
    }

    function completeSkippedSentenceStep(item, spellingAnswer) {
      state.pendingJudgement = {
        itemId: item.id,
        mode: "final",
        score: 40,
        spellingCorrect: false,
        sentenceGood: false,
        spellingAnswer,
        sentence: "",
        skippedSentence: true,
        analysis: null
      };
      setResult(`
        <strong>已显示正确内容，请你判断这条是否需要复习。</strong>
        <p><strong>正确拼写：</strong> ${escapeHtml(item.title)}</p>
        <p><strong>听写状态：</strong> 主动展示内容，听写记为未通过。</p>
        <p><strong>造句状态：</strong> 已跳过造句。</p>
        <div class="mini-actions">
          <button class="mini" data-final-judge="remembered" type="button">记为掌握</button>
          <button class="mini" data-final-judge="review" type="button">需要复习</button>
        </div>
      `, "bad");
    }

    async function checkAnswer() {
      const item = getCurrentItem();
      if (!item) {
        setResult("请先开始一轮随机练习。", "bad");
        return;
      }
      const answer = els.answerInput.value.trim();
      if (!answer) {
        setResult("请先写出你听到的单词或词组。", "bad");
        return;
      }
      if (!isEnglishOnly(els.answerInput.value)) {
        setResult("答案只能输入英文。", "bad");
        return;
      }

      if (state.reviewStep === "sentence") {
        if (!state.currentReview || state.currentReview.itemId !== item.id) {
          startSentenceStep(false, "");
          return;
        }
        const sentence = answer;
        const sentenceUsesTerm = isExampleSentence(item.title, sentence);
        const score = sentenceUsesTerm ? 100 : 40;
        completeSentenceStep(item, sentence, score);
        return;
      }

      if (spellingMatches(item.title, answer)) {
        startSentenceStep(true, answer);
        return;
      }

      state.pendingJudgement = {
        itemId: item.id,
        score: 0,
        answer,
        mode: "spelling"
      };

      setResult(`
        <strong>拼写还不对</strong>
        <p><strong>你的答案：</strong> ${escapeHtml(answer)}</p>
        <p>要现在显示正确拼写吗？显示后听写会记为未通过，但仍会进入造句环节。</p>
        <div class="mini-actions">
          <button class="mini" data-spelling-action="show" type="button">显示正确拼写</button>
          <button class="mini" data-spelling-action="retry" type="button">再试一次</button>
        </div>
      `, "bad");
    }

    async function previewDefinitionFromDictionary() {
      const title = els.titleInput.value.trim();
      if (!title) {
        setNotice("请先输入英文单词或词组。", "error");
        return { ok: false, canSave: false, message: "请先输入英文单词或词组。" };
      }
      if (!isEnglishOnly(title)) {
        setNotice("单词或词组只能输入英文。", "error");
        return { ok: false, canSave: false, message: "单词或词组只能输入英文。" };
      }
      setNotice("正在校验英文词条...", "");
      els.saveBtn.disabled = true;
      try {
        if (shouldSkipOnlineDictionaryCheck(title)) {
          setNotice("基础英文内容已通过本地校验，可以保存。", "ok");
          return { ok: true, canSave: true, message: "本地校验通过。" };
        }
        const definition = await lookupDefinition(title);
        setNotice("校验通过，可以保存。", "ok");
        return { ok: true, canSave: true, message: "校验通过。" };
      } catch (error) {
        if (isDictionaryLookupUnavailable(error)) {
          setNotice("在线词典校验超时，已跳过校验并继续保存。", "warn");
          return {
            ok: true,
            canSave: true,
            skippedOnlineValidation: true,
            message: "在线词典校验超时，已跳过校验。"
          };
        }
        const isPhrase = words(title).length > 1;
        if (isPhrase) {
          const checkedWords = await validatePhraseWords(title);
          const badWords = checkedWords.filter(item => !item.ok);
          if (badWords.length) {
            const details = badWords
              .map(item => {
                const suggestions = item.suggestions.length ? `，可能是：${item.suggestions.slice(0, 5).join(", ")}` : "";
                return `${item.word}${suggestions}`;
              })
              .join("\n");
            setNotice("词组里有单词可能拼错，请确认。", "error");
            return {
              ok: false,
              canSave: true,
              needsConfirm: true,
              message: `发现下面这些单词可能有拼写问题：\n${details}\n\n如果你确认原文没问题，仍然可以保存到词库。是否继续保存？`
            };
          }
          setNotice("词组整体未收录，但核心单词校验通过，已允许保存。", "ok");
          return {
            ok: true,
            canSave: true,
            message: "核心单词校验通过。"
          };
        }
        let suggestions = [];
        try {
          suggestions = await suggestEnglishTerms(title);
        } catch {
          suggestions = [];
        }
        const suggestionText = suggestions.length ? `\n可能相近：${suggestions.slice(0, 5).join(", ")}` : "";
        setNotice("没有查到这个词条，请确认拼写。", "error");
        return {
          ok: false,
          canSave: true,
          needsConfirm: true,
          message: `没有查到单词 “${title}”，可能是拼写有误。${suggestionText}\n\n仍然添加到词库吗？`
        };
      } finally {
        els.saveBtn.disabled = false;
      }
    }

    async function saveItem() {
      const title = els.titleInput.value.trim();

      if (!title) {
        setNotice("请先输入英文单词或词组。", "error");
        return;
      }
      if (!isEnglishOnly(title)) {
        setNotice("单词或词组只能输入英文。", "error");
        return;
      }

      const validation = await previewDefinitionFromDictionary();
      if (!validation.canSave) return;
      if (validation.needsConfirm && !confirm(validation.message)) {
        setNotice("已取消保存。请修改词条后再试。", "error");
        return;
      }

      if (state.editingId) {
        const duplicate = findDuplicateItem(title, state.editingId);
        if (duplicate) {
          setNotice(`词库里已经有 “${duplicate.title}”，不会重复保存。`, "error");
          return;
        }
        const item = state.items.find(entry => entry.id === state.editingId);
        if (item) {
          item.title = title;
          delete item.content;
          delete item.definitionSource;
          item.updatedAt = new Date().toISOString();
        }
        state.editingId = null;
        els.saveBtn.lastChild.textContent = " 校验并保存";
        setNotice("已更新词条。", "ok");
      } else {
        const duplicate = findDuplicateItem(title);
        if (duplicate) {
          setNotice(`词库里已经有 “${duplicate.title}”，不会重复添加。`, "error");
          return;
        }
        state.items.unshift({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          title,
          reviews: 0,
          correct: 0,
          memoryStage: 0,
          nextReviewAt: getTomorrowStartIso(),
          createdAt: new Date().toISOString()
        });
        setNotice("已保存词条。后续会用于听写和造句复习。", "ok");
      }

      els.titleInput.value = "";
      persist();
      renderAll();
    }

    function setNotice(message, tone = "") {
      els.formNotice.className = `notice ${tone}`.trim();
      els.formNotice.textContent = message;
    }

    function renderStats() {
      const totalReviews = state.items.reduce((sum, item) => sum + (item.reviews || 0), 0);
      const totalCorrect = state.items.reduce((sum, item) => sum + (item.correct || 0), 0);
      const reviewedItems = state.items.filter(item => Number(item.reviews || 0) > 0).length;
      const masteredItems = state.items.filter(item => Number(item.correct || 0) >= 5).length;
      els.totalCount.textContent = state.items.length;
      els.reviewedItemCount.textContent = reviewedItems;
      els.masteredCount.textContent = masteredItems;
      els.reviewedCount.textContent = totalReviews;
      els.accuracyCount.textContent = totalReviews ? `${Math.round((totalCorrect / totalReviews) * 100)}%` : "0%";
      els.dueCount.textContent = getDueItems().length;
    }

    function renderList() {
      if (!state.items.length) {
        els.itemList.innerHTML = `<p class="hint">还没有材料。</p>`;
        return;
      }

      const query = normalized(els.librarySearchInput.value || "");
      let visibleItems = state.items;
      if (state.libraryFilter === "reviewed") {
        visibleItems = visibleItems.filter(item => Number(item.reviews || 0) > 0);
      } else if (state.libraryFilter === "mastered") {
        visibleItems = visibleItems.filter(item => Number(item.correct || 0) >= 5);
      } else if (state.libraryFilter === "correct") {
        visibleItems = visibleItems.filter(item => Number(item.correct || 0) > 0);
      } else if (state.libraryFilter === "due") {
        const dueIds = new Set(getDueItems().map(item => item.id));
        visibleItems = visibleItems.filter(item => dueIds.has(item.id));
      }
      if (query) {
        visibleItems = visibleItems.filter(item => normalized(item.title).includes(query));
      }

      if (!visibleItems.length) {
        const emptyText = getLibraryEmptyText();
        els.itemList.innerHTML = `<p class="hint">${emptyText}</p>`;
        return;
      }

      const filterNotice = state.libraryFilter !== "all"
        ? `<p class="hint">正在查看${getLibraryFilterLabel()}。点击“词库”可回到全部内容。</p>`
        : "";
      els.itemList.innerHTML = filterNotice + visibleItems.map(item => `
        <article class="card">
          <div class="card-title">
            <span>${escapeHtml(item.title)}</span>
            <span class="hint card-stats">
              <span>答对 ${Number(item.correct || 0)} 次</span>
              <span>复习 ${Number(item.reviews || 0)} 次</span>
            </span>
          </div>
          ${Number(item.correct || 0) >= 5 ? `<p>状态：完全掌握</p>` : ""}
          <div class="card-footer">
            <div class="mini-actions">
              <button class="mini" data-action="play" data-id="${item.id}" type="button">播放</button>
              <button class="mini" data-action="edit" data-id="${item.id}" type="button">编辑</button>
              <button class="mini" data-action="delete" data-id="${item.id}" type="button">删除</button>
            </div>
            <span class="entry-date">录入 ${escapeHtml(formatEntryDate(item.createdAt))}</span>
          </div>
        </article>
      `).join("");
    }

    function getLibraryFilterLabel() {
      const labels = {
        reviewed: "已复习内容",
        mastered: "完全掌握内容",
        correct: "答对过的内容",
        due: "到期复习内容"
      };
      return labels[state.libraryFilter] || "全部内容";
    }

    function getLibraryEmptyText() {
      const texts = {
        reviewed: "还没有已复习的内容。",
        mastered: "还没有完全掌握的内容。",
        correct: "还没有答对过的内容。",
        due: "当前没有到期复习的内容。"
      };
      return texts[state.libraryFilter] || "没有找到匹配内容。";
    }

    function renderVoices() {
      const americanVoices = "speechSynthesis" in window
        ? window.speechSynthesis.getVoices()
          .filter(voice => /^en[-_]US$/i.test(voice.lang) && guessVoiceGenderLabel(voice) !== "性别未知")
        : [];
      const onlineBrowserVoices = pickPreferredAmericanVoices(americanVoices.filter(voice =>
        voice.localService === false || voice.name.toLowerCase().includes("online")
      ));
      const localBrowserVoices = pickPreferredAmericanVoices(americanVoices.filter(voice =>
        voice.localService !== false && !voice.name.toLowerCase().includes("online")
      ));
      state.browserVoices = [...onlineBrowserVoices, ...localBrowserVoices];
      state.voices = [
        ...(state.azureTtsConfigured ? ONLINE_TTS_VOICES : []),
        ...state.browserVoices
      ];
      if (!state.voices.length && "speechSynthesis" in window) {
        state.voices = [{ name: "browser-default", label: "浏览器默认美式声音", lang: "en-US", defaultBrowserVoice: true }];
      }
      const options = state.voices;
      if (!options.length) {
        els.voiceSelect.innerHTML = `<option value="">未配置在线美式语音</option>`;
        state.settings.voiceName = "";
        persistSettings();
        return;
      }
      els.voiceSelect.innerHTML = options.map(voice => {
        if (voice.onlineTts) {
          return `<option value="${escapeHtml(voice.name)}">${escapeHtml(voice.label)} (${escapeHtml(voice.lang)})</option>`;
        }
        if (voice.defaultBrowserVoice) {
          return `<option value="${voice.name}">${voice.label} (${voice.lang})</option>`;
        }
        const gender = guessVoiceGenderLabel(voice);
        const source = voice.localService ? "本机" : "Edge 在线";
        const natural = voice.name.toLowerCase().includes("natural") ? "自然" : "";
        return `<option value="${escapeHtml(voice.name)}">${escapeHtml(voice.name)} · ${source}${natural} · ${gender} (${escapeHtml(voice.lang)})</option>`;
      }).join("");
      const savedVoice = options.find(voice => voice.name === state.settings.voiceName);
      if (savedVoice) {
        els.voiceSelect.value = savedVoice.name;
        state.nextSpeechVoiceIndex = Math.max(0, options.findIndex(voice => voice.name === savedVoice.name));
      } else {
        state.settings.voiceName = options[0].name;
        els.voiceSelect.value = options[0].name;
        state.nextSpeechVoiceIndex = 0;
        persistSettings();
      }
    }

    async function loadTtsStatus() {
      try {
        const response = await fetch("/api/tts/status", { cache: "no-store" });
        if (!response.ok) return;
        const status = await response.json();
        state.azureTtsConfigured = Boolean(status.configured);
      } catch {
        state.azureTtsConfigured = false;
      }
    }

    function renderAll() {
      renderStats();
      renderList();
      renderPrompt();
    }

    function switchPane(target) {
      const library = target === "library";
      els.addTab.classList.toggle("active", !library);
      els.libraryTab.classList.toggle("active", library);
      els.addPane.classList.toggle("hidden", library);
      els.libraryPane.classList.toggle("hidden", !library);
    }

    function exportItems() {
      const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `english-dictation-review-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importItems(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          const clean = cleanImportedItems(data);
          state.items = clean;
          persist();
          renderAll();
        } catch {
          alert("无法导入这个文件。");
        }
      };
      reader.readAsText(file);
    }

    function editItem(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item) return;
      state.editingId = id;
      els.titleInput.value = item.title;
      els.saveBtn.lastChild.textContent = " 校验并更新";
      setNotice("正在编辑选中的材料。", "");
      switchPane("add");
    }

    function deleteItem(id) {
      state.items = state.items.filter(item => item.id !== id);
      if (state.currentId === id) state.currentId = null;
      state.roundIds = state.roundIds.filter(itemId => itemId !== id);
      if (state.roundIndex >= state.roundIds.length) state.roundIndex = Math.max(0, state.roundIds.length - 1);
      persist();
      renderAll();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeEnglishPunctuation(value) {
      return String(value)
        .normalize("NFKC")
        .replace(/[\u201C\u201D\u300C\u300D\u300E\u300F]/g, "\"")
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[。．]/g, ".")
        .replace(/[，、]/g, ",")
        .replace(/[？]/g, "?")
        .replace(/[！]/g, "!")
        .replace(/[；]/g, ";")
        .replace(/[：]/g, ":")
        .replace(/[—–]/g, "-")
        .replace(/[（]/g, "(")
        .replace(/[）]/g, ")")
        .replace(/[【［]/g, "[")
        .replace(/[】］]/g, "]")
        .replace(/…/g, "...");
    }

    [els.titleInput, els.answerInput].forEach(input => {
      input.addEventListener("input", () => {
        const normalizedValue = normalizeEnglishPunctuation(input.value);
        if (input.value !== normalizedValue) {
          input.value = normalizedValue;
        }
        if (!isEnglishOnly(input.value)) {
          input.value = input.value.replace(/[^\x09\x0A\x0D\x20-\x7E]/g, "");
          setNotice("已移除非英文字符。", "error");
        }
      });
    });

    els.titleInput.addEventListener("input", () => {
      if (!state.editingId) setNotice("", "");
    });

    els.randomBtn.addEventListener("click", startDueRound);
    els.nextBtn.addEventListener("click", nextItem);
    els.answerMicBtn.addEventListener("click", () => startVoiceInput(els.answerInput, "result"));
    els.titleMicBtn.addEventListener("click", () => {
      els.titleInput.value = "";
      startVoiceInput(els.titleInput, "notice", els.titleMicBtn, transcript => {
        const spoken = cleanSpokenTerm(transcript);
        els.titleInput.value = spoken;
        els.titleInput.dispatchEvent(new Event("input"));
        if (!spoken) {
          setNotice("没有识别到有效英文词条。", "error");
          return;
        }
        setNotice(`已识别到 “${spoken}”。确认无误后，请手动点击“校验并保存”。`, "ok");
      });
    });
    els.checkBtn.addEventListener("click", checkAnswer);
    els.promptBox.addEventListener("click", event => {
      const playButton = event.target.closest("button[data-play-current]");
      if (playButton) {
        const item = getCurrentItem();
        if (!item) {
          setResult("请先开始到期复习。", "bad");
          return;
        }
        if (playButton.dataset.playCurrent === "repeat") {
          if (repeatPlayback.active && repeatPlayback.button === playButton) {
            stopRepeatPlayback();
          } else {
            startRepeatPlayback(item.title, playButton);
          }
        } else {
          stopRepeatPlayback();
          speak(item.title, playButton);
        }
        return;
      }

      const revealButton = event.target.closest("button[data-reveal-current]");
      const skipSentenceButton = event.target.closest("button[data-reveal-skip-sentence]");
      if (!revealButton && !skipSentenceButton) return;
      const item = getCurrentItem();
      if (!item || state.reviewStep !== "spelling") return;
      if (skipSentenceButton) {
        completeSkippedSentenceStep(item, "主动展示内容");
        return;
      }
      startSentenceStep(false, "主动展示内容", true);
    });
    els.resultBox.addEventListener("click", event => {
      const finalButton = event.target.closest("button[data-final-judge]");
      if (finalButton && state.pendingJudgement?.mode === "final") {
        const item = state.items.find(entry => entry.id === state.pendingJudgement.itemId);
        if (!item) return;
        const remembered = finalButton.dataset.finalJudge === "remembered";
        const sentence = state.pendingJudgement.sentence || "";
        const spellingAnswer = state.pendingJudgement.spellingAnswer || "";
        const skippedSentence = Boolean(state.pendingJudgement.skippedSentence);
        recordReviewResult(item, remembered, remembered ? 100 : 40);
        setResult(`
          <strong>${remembered ? "已记为掌握。" : "已标记为需要复习。"}</strong>
          <p><strong>正确拼写：</strong> ${escapeHtml(item.title)}</p>
          ${spellingAnswer ? `<p><strong>你的听写：</strong> ${escapeHtml(spellingAnswer)}</p>` : ""}
          ${skippedSentence ? `<p><strong>造句状态：</strong> 已跳过造句。</p>` : `<p><strong>你的句子：</strong> ${escapeHtml(sentence)}</p>`}
          <p><strong>累计答对：</strong> ${Number(item.correct || 0)} 次</p>
          <p><strong>累计复习：</strong> ${Number(item.reviews || 0)} 次</p>
          <p><strong>下次复习：</strong> ${escapeHtml(formatReviewTime(item.nextReviewAt))}</p>
          ${getNextRoundAction()}
        `, remembered ? "good" : "bad");
        return;
      }

      const resultNextButton = event.target.closest("button[data-result-next]");
      if (resultNextButton) {
        nextItem();
        return;
      }

      const spellingButton = event.target.closest("button[data-spelling-action]");
      if (spellingButton && state.pendingJudgement?.mode === "spelling") {
        const item = state.items.find(entry => entry.id === state.pendingJudgement.itemId);
        if (!item) return;
        if (spellingButton.dataset.spellingAction === "retry") {
          setResult("好的，不显示答案。你可以再听一次，重新输入后检查。", "");
          speak(item.title);
          return;
        }
        const submittedAnswer = state.pendingJudgement.answer || "";
        startSentenceStep(false, submittedAnswer, true);
        return;
      }

      const button = event.target.closest("button[data-judge]");
      if (!button || !state.pendingJudgement) return;
      const item = state.items.find(entry => entry.id === state.pendingJudgement.itemId);
      if (!item) return;
      const remembered = button.dataset.judge === "correct";
      const definition = state.pendingJudgement.definition || "";
      recordReviewResult(item, remembered, state.pendingJudgement.score);
      setResult(`
        <strong>${remembered ? "已记为正确。" : "已记为错误，需要再复习。"}</strong>
        <p><strong>词典释义：</strong> ${escapeHtml(definition).replace(/\n/g, "<br>")}</p>
        <p><strong>累计答对：</strong> ${Number(item.correct || 0)} 次</p>
        <p><strong>下次复习：</strong> ${escapeHtml(formatReviewTime(item.nextReviewAt))}</p>
        ${getNextRoundAction()}
      `, remembered ? "good" : "bad");
    });
    els.saveBtn.addEventListener("click", saveItem);
    els.notifyBtn.addEventListener("click", async () => {
      if (!("Notification" in window)) {
        setNotice("当前浏览器不支持桌面提醒。", "error");
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        setNotice("复习提醒已开启。页面打开时，到期内容会提醒你。", "ok");
        maybeNotifyDueItems();
      } else {
        setNotice("提醒权限没有开启。你仍然可以手动点击“到期复习”。", "error");
      }
    });
    els.addTab.addEventListener("click", () => switchPane("add"));
    els.libraryTab.addEventListener("click", () => {
      state.libraryFilter = "all";
      renderList();
      switchPane("library");
    });
    els.statFilterButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.libraryFilter = button.dataset.libraryFilter || "all";
        els.librarySearchInput.value = "";
        switchPane("library");
        renderList();
      });
    });
    els.librarySearchInput.addEventListener("input", renderList);
    els.exportBtn.addEventListener("click", exportItems);
    els.importBtn.addEventListener("click", () => els.importFile.click());
    els.importFile.addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) importItems(file);
      event.target.value = "";
    });
    els.voiceSelect.addEventListener("change", () => {
      state.settings.voiceName = els.voiceSelect.value;
      const selectedIndex = state.voices.findIndex(voice => voice.name === els.voiceSelect.value);
      state.nextSpeechVoiceIndex = selectedIndex >= 0 ? selectedIndex : 0;
      state.lastSpeechVoiceName = "";
      persistSettings();
    });
    els.rateSelect.addEventListener("change", () => {
      state.settings.rate = els.rateSelect.value;
      persistSettings();
    });
    els.clearBtn.addEventListener("click", () => {
      if (confirm("确定清空所有已保存的英文材料吗？")) {
        state.items = [];
        state.currentId = null;
        state.roundIds = [];
        state.roundIndex = 0;
        persist();
        renderAll();
      }
    });
    els.itemList.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = button.dataset.id;
      if (button.dataset.action === "play") {
        const item = state.items.find(entry => entry.id === id);
        if (item) speak(item.title, button);
      }
      if (button.dataset.action === "edit") editItem(id);
      if (button.dataset.action === "delete") deleteItem(id);
    });

    async function initialize() {
      load();
      await loadTtsStatus();
      renderVoices();
      const loadedShared = await loadSharedItems();
      if (!loadedShared) await restoreFromExportIfEmpty();
      renderAll();
      maybeNotifyDueItems();
    }

    initialize();
    setInterval(() => {
      renderStats();
      renderList();
      maybeNotifyDueItems();
    }, 60000);
    setInterval(refreshSharedItems, 5000);
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = renderVoices;
    }
  </script>
</body>
</html>
